spring.application.name=contact-app

#Database
spring.datasource.url=jdbc:mysql://localhost:3306/contact_app_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root123}

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Server
server.port=8080

#JWT
jwt.secret=contact-app-secret-key-for-jwt-authentication-2026
jwt.expiration=3600000
